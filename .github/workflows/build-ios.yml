name: Build iOS

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v3
  
    - uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        architecture: x64
  
    - run: flutter pub get
  
    - run: pod repo update
      working-directory: ios
  
    - run: flutter build ios --release --no-tree-shake-icons --no-codesign
  
    - run: mkdir Payload
      working-directory: build/ios/iphoneos
  
    - run: mv Runner.app/ Payload
      working-directory: build/ios/iphoneos
  
    - name: Zip output
      run: zip -qq -r -9 Flow.ipa Payload
      working-directory: build/ios/iphoneos
  
    - name: Upload IPA to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Flow-IPA
        path: build/ios/iphoneos/Flow.ipa
        retention-days: 30
