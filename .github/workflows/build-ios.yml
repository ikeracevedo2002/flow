name: Build iOS

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Updated to 3.24.0 for better compatibility with macOS 15/Xcode 16
          flutter-version: 'any'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ipa --release --no-tree-shake-icons --export-options-plist=$HOME/export_options.plist
      - name: Upload IPA to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flow-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 30
